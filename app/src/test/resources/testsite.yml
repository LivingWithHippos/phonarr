---
id: testsite
name: Test Site
description: "Fixture used by unit tests"
language: en-US
type: public
encoding: UTF-8
links:
  - https://test.example/

caps:
  categorymappings:
    - {id: 1, cat: Movies, desc: "Movies"}
    - {id: 2, cat: TV/HD, desc: "TV HD"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]

settings:
  - name: sort
    type: select
    label: Sort
    default: seeders
    options:
      seeders: Seeders
      time: Time

search:
  paths:
    - path: "{{ if .Keywords }}search/{{ .Keywords }}/1/{{ else }}latest/{{ end }}"
  inputs:
    sort: "{{ .Config.sort }}"
    $raw: "{{ range .Categories }}c[]={{.}}&{{end}}"
  rows:
    selector: table.list tr:has(a.title)
  fields:
    category:
      selector: td.cat a
      attribute: href
      filters:
        - name: regexp
          args: "/cat/(\\d+)/"
    title:
      selector: a.title
    details:
      selector: a.title
      attribute: href
    download:
      selector: a[href^="magnet:"]
      attribute: href
    size:
      selector: td.size
    seeders:
      selector: td.seeds
    leechers:
      selector: td.leech
    date:
      selector: td.date
      filters:
        - name: append
          text: ""
        - name: timeago
    description|optional:
      selector: span.desc
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
